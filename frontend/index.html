<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="C.E.L.I.N.A">
  <title>C.E.L.I.N.A</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/hungry_yoshi.png">
  <link rel="stylesheet" href="/styles.css?v=18">
</head>
<body>
  <main>
    <header>
      <h1>C.E.L.I.N.A</h1>
      <p class="eyebrow">Celine's Exclusive Life Information &amp; Network Assistant</p>
      <p class="notify">
        <button type="button" id="notify">Allow notifications</button>
        <span id="notify-note" hidden></span>
      </p>
    </header>

    <section class="card schedule" id="schedule" aria-labelledby="schedule-title">
      <img src="/images/clock_yoshi.jpg" alt="Yoshi holding a clock">
      <div class="schedule-body">
        <div class="schedule-head">
          <div class="schedule-title">
            <h2 id="schedule-title">Schedule</h2>
            <label class="view-date">
              Date
              <input id="view-date" type="date" required>
            </label>
          </div>
          <button type="button" id="edit">Edit</button>
        </div>
        <div class="event-scroll">
          <ul id="events"></ul>
          <p id="empty" hidden>Nothing on this day.</p>
        </div>
        <form id="editor" hidden>
          <label>Name <input id="activity" name="activity" required></label>
          <label>Date <input id="event-date" name="event-date" type="date" required></label>
          <div class="times">
            <label>Start <input id="start" name="start" type="time" required></label>
            <label>End <input id="end" name="end" type="time" required></label>
          </div>
          <label>Repeat
            <select id="repeat" name="repeat">
              <option value="">Does not repeat</option>
              <option value="daily">Every day</option>
              <option value="weekdays">Weekdays</option>
              <option value="weekly">Every week</option>
              <option value="monthly">Every month</option>
            </select>
          </label>
          <label id="until-label" hidden>Until <input id="until" name="until" type="date"></label>
          <button type="submit">Add</button>
          <p id="schedule-note" hidden></p>
          <div id="schedule-prompt" hidden></div>
        </form>
      </div>
    </section>

    <section class="card routes" aria-labelledby="routes-title">
      <h2 id="routes-title">Bus</h2>
      <div class="pair">
        <div class="ride" id="school">
          <img src="/images/going_out_yoshi.jpg" alt="Yoshi holding a sign that says Going out">
          <div class="ride-times" hidden>
            <p class="leave"></p>
            <p class="eta"></p>
            <a class="see-route" href="" target="_blank" rel="noopener">See route</a>
          </div>
          <p class="message">Looking up the bus.</p>
          <button type="button" class="here">Use current location</button>
        </div>
        <div class="ride" id="home">
          <img src="/images/going_home_yoshi.jpg" alt="Yoshi holding a sign that says Going home">
          <div class="ride-times" hidden>
            <p class="leave"></p>
            <p class="eta"></p>
            <a class="see-route" href="" target="_blank" rel="noopener">See route</a>
          </div>
          <p class="message">Looking up the bus.</p>
          <button type="button" class="here">Use current location</button>
        </div>
      </div>
    </section>

    <section class="card reminders" aria-labelledby="reminder-title">
      <h2 id="reminder-title">Eat and drink</h2>
      <div class="pair">
        <button type="button" id="food" data-status="now">
          <img src="/images/hungry_yoshi.png" alt="Yoshi is hungry">
          <p class="message"></p>
        </button>
        <button type="button" id="water" data-status="now">
          <img src="/images/thirsty_yoshi_square.jpg" alt="Yoshi is thirsty">
          <p class="message"></p>
        </button>
      </div>
    </section>

    <section class="card reasons" id="reasons" aria-labelledby="reasons-title">
      <div class="reasons-head">
        <h2 id="reasons-title">21 reasons why</h2>
        <p id="reason-count">1 / 21</p>
      </div>
      <p id="reason-text"></p>
      <button type="button" id="reason-play" aria-label="Play this reason">
        <video id="reason-image" hidden muted loop autoplay playsinline></video>
        <span id="reason-play-label">Play</span>
      </button>
    </section>

    <p id="error" class="error" hidden>The page could not load. Try again in a moment.</p>
  </main>
  <script src="/app.js?v=13"></script>
</body>
</html>
